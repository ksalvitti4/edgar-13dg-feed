name: Update 13D/G feeds
 
on:
  schedule:
    # Every 2 hours, Monday through early Saturday (times are UTC).
    - cron: "20 */2 * * 1-6"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - run: pip install -r requirements.txt
 
      - name: Build feeds
        run: |
          # SEC endpoints can occasionally time out while reading a response.
          # The script already retries individual requests; retry the complete
          # build as a final safeguard so one transient SEC outage does not
          # fail the scheduled workflow.
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            if python edgar_filter.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Build failed; retrying in ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "Feed build failed after 3 attempts."
          exit 1
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAX_MARKET_CAP: ${{ vars.MAX_MARKET_CAP }}
 
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || (
            git commit -m "Update feeds" &&
            git fetch origin main &&
            git rebase origin/main &&
            git push
          )
